name: Site checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run test:registry
      - run: npm run test:signals
      - run: npm run test:constituencies
      - run: npm run test:source-onboarding
      - run: npm run lint
      - run: npm run build
      - run: npm run check:contrast
      - run: npm run check:text-size
      - run: npm run check:sitemap
      - run: npm run check:parity
