name: Site checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run test:registry
      - run: npm run test:signals
      - run: npm run test:constituencies
      - run: npm run test:source-onboarding
      - run: npm run lint
      - run: npm run build
      - run: npm run check:contrast
      - run: npm run check:text-size
      - run: npm run check:sitemap
      - run: npm run check:parity
